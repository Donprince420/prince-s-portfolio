<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prince The Don | Admin</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1,
    h2 {
      margin-bottom: 20px;
    }

    .box {
      background: #151522;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 15px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #0f0f18;
      color: white;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    label {
      font-weight: bold;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #7c3aed;
      color: white;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #loginMessage,
    #status {
      margin-top: 15px;
    }

    .logout {
      margin-top: 20px;
      background: #dc2626;
    }

  </style>

</head>


<body>

<div class="container">


  <!-- =====================================
       LOGIN
  ====================================== -->

  <div id="loginBox" class="box">

    <h2>🔐 Admin Login</h2>

    <label for="loginEmail">
      Email
    </label>

    <input
      type="email"
      id="loginEmail"
      placeholder="Admin email"
      autocomplete="email"
    >


    <label for="loginPassword">
      Password
    </label>

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
      autocomplete="current-password"
    >


    <button
      type="button"
      onclick="login()"
    >
      Login
    </button>


    <p id="loginMessage"></p>

  </div>



  <!-- =====================================
       ADMIN PANEL
  ====================================== -->

  <div
    id="adminPanel"
    class="box"
    style="display:none;"
  >

    <h1>🎵 Beat Admin</h1>

    <p>
      Upload a new beat to your store.
    </p>


    <!-- =====================================
         BEAT FORM
    ====================================== -->

    <form id="beatForm">


      <!-- TITLE -->

      <label for="title">
        Beat Title
      </label>

      <input
        type="text"
        id="title"
        placeholder="Example: Kigali Nights"
        required
      >



      <!-- DESCRIPTION -->

      <label for="description">
        Description
      </label>

      <textarea
        id="description"
        placeholder="Describe your beat..."
      ></textarea>



      <!-- GENRE -->

      <label for="genre">
        Genre
      </label>

      <input
        type="text"
        id="genre"
        placeholder="Example: Drill, Amapiano, Afro"
      >



      <!-- BPM -->

      <label for="bpm">
        BPM
      </label>

      <input
        type="number"
        id="bpm"
        placeholder="Example: 140"
      >



      <!-- KEY -->

      <label for="musicalKey">
        Musical Key
      </label>

      <input
        type="text"
        id="musicalKey"
        placeholder="Example: C Minor"
      >



      <!-- PRICE -->

      <label for="price">
        Price
      </label>

      <input
        type="number"
        id="price"
        placeholder="Example: 10000"
        min="0"
        required
      >



      <!-- CURRENCY -->

      <label for="currency">
        Currency
      </label>

      <select id="currency">

        <option value="RWF">
          RWF
        </option>

        <option value="USD">
          USD
        </option>

      </select>



      <!-- PREVIEW -->

      <label for="preview">
        Beat Preview
      </label>

      <input
        type="file"
        id="preview"
        accept="audio/*"
        required
      >



      <!-- COVER -->

      <label for="cover">
        Cover Image
      </label>

      <input
        type="file"
        id="cover"
        accept="image/*"
        required
      >



      <!-- UPLOAD -->

      <button
        type="submit"
        id="uploadButton"
      >
        Upload Beat
      </button>


      <p id="status"></p>


    </form>



    <!-- LOGOUT -->

    <button
      type="button"
      class="logout"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

</div>



<!-- =====================================
     SUPABASE
====================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* ======================================
   SUPABASE CONNECTION
====================================== */

const SUPABASE_URL =
  "https://lcqluqizcaenxhvcwokw.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_rwB9WmkyujVyB-6W_orZ4Q_P8yKn7mh";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );



/* ======================================
   ADMIN LOGIN
====================================== */

async function login() {

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();


  const password =
    document
      .getElementById("loginPassword")
      .value;


  const message =
    document.getElementById("loginMessage");


  if (!email || !password) {

    message.textContent =
      "❌ Enter your email and password.";

    return;
  }


  message.textContent =
    "Logging in...";


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    console.error(error);

    message.textContent =
      "❌ " + error.message;

    return;
  }


  message.textContent =
    "✅ Login successful!";


  showAdminPanel();

}



/* ======================================
   SHOW ADMIN PANEL
====================================== */

function showAdminPanel() {

  document
    .getElementById("loginBox")
    .style.display = "none";


  document
    .getElementById("adminPanel")
    .style.display = "block";

}



/* ======================================
   LOGOUT
====================================== */

async function logout() {

  await supabaseClient.auth.signOut();


  document
    .getElementById("adminPanel")
    .style.display = "none";


  document
    .getElementById("loginBox")
    .style.display = "block";


  document
    .getElementById("loginMessage")
    .textContent = "";

}



/* ======================================
   CHECK EXISTING LOGIN
====================================== */

async function checkLogin() {

  const { data } =
    await supabaseClient.auth.getSession();


  if (data.session) {

    showAdminPanel();

  } else {

    document
      .getElementById("loginBox")
      .style.display = "block";


    document
      .getElementById("adminPanel")
      .style.display = "none";

  }

}



/* ======================================
   BEAT FORM
====================================== */

const form =
  document.getElementById("beatForm");


const status =
  document.getElementById("status");


const uploadButton =
  document.getElementById("uploadButton");



form.addEventListener(
  "submit",
  async function(event) {


    event.preventDefault();


    /* Make sure user is logged in */

    const { data: sessionData } =
      await supabaseClient.auth.getSession();


    if (!sessionData.session) {

      status.textContent =
        "❌ Please login first.";

      return;

    }


    uploadButton.disabled = true;


    status.textContent =
      "Uploading beat...";



    try {


      /* =================================
         GET FORM VALUES
      ================================= */

      const title =
        document
          .getElementById("title")
          .value
          .trim();


      const description =
        document
          .getElementById("description")
          .value
          .trim();


      const genre =
        document
          .getElementById("genre")
          .value
          .trim();


      const bpm =
        document
          .getElementById("bpm")
          .value;


      const musicalKey =
        document
          .getElementById("musicalKey")
          .value
          .trim();


      const price =
        document
          .getElementById("price")
          .value;


      const currency =
        document
          .getElementById("currency")
          .value;


      const previewFile =
        document
          .getElementById("preview")
          .files[0];


      const coverFile =
        document
          .getElementById("cover")
          .files[0];



      /* =================================
         VALIDATION
      ================================= */

      if (!title) {

        throw new Error(
          "Please enter a beat title."
        );

      }


      if (!previewFile) {

        throw new Error(
          "Please select a beat preview."
        );

      }


      if (!coverFile) {

        throw new Error(
          "Please select a cover image."
        );

      }



      /* =================================
         UNIQUE FILE NAMES
      ================================= */

      const timestamp =
        Date.now();


      const safeTitle =
        title
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-");


      const previewExtension =
        previewFile.name
          .split(".")
          .pop();


      const coverExtension =
        coverFile.name
          .split(".")
          .pop();


      const previewPath =
        `${timestamp}-${safeTitle}.${previewExtension}`;


      const coverPath =
        `${timestamp}-${safeTitle}.${coverExtension}`;



      /* =================================
         UPLOAD AUDIO
      ================================= */

      status.textContent =
        "Uploading audio...";


      const { error: previewError } =
        await supabaseClient.storage
          .from("beats")
          .upload(
            previewPath,
            previewFile
          );


      if (previewError) {

        throw previewError;

      }



      /* =================================
         UPLOAD COVER
      ================================= */

      status.textContent =
        "Uploading cover...";


      const { error: coverError } =
        await supabaseClient.storage
          .from("beat-covers")
          .upload(
            coverPath,
            coverFile
          );


      if (coverError) {

        throw coverError;

      }



      /* =================================
         GET PUBLIC URLS
      ================================= */

      const { data: previewData } =
        supabaseClient.storage
          .from("beats")
          .getPublicUrl(
            previewPath
          );


      const { data: coverData } =
        supabaseClient.storage
          .from("beat-covers")
          .getPublicUrl(
            coverPath
          );



      /* =================================
         SAVE TO DATABASE
      ================================= */

      status.textContent =
        "Saving beat information...";


      const { error: databaseError } =
        await supabaseClient
          .from("beats")
          .insert({

            title: title,

            description: description,

            genre: genre,

            bpm: bpm
              ? Number(bpm)
              : null,

            musical_key: musicalKey,

            price: Number(price),

            currency: currency,

            preview_url:
              previewData.publicUrl,

            cover_url:
              coverData.publicUrl,

            is_published: true

          });


      if (databaseError) {

        throw databaseError;

      }



      /* =================================
         SUCCESS
      ================================= */

      status.textContent =
        "✅ Beat uploaded successfully!";


      form.reset();


    } catch (error) {

      console.error(error);


      status.textContent =
        "❌ Upload failed: " +
        error.message;


    } finally {

      uploadButton.disabled = false;

    }

  }
);



/* ======================================
   START LOGIN CHECK
====================================== */

checkLogin();


</script>


</body>

</html>
